services:
  godot:
    container_name: godot
    build:
      context: ./client
    working_dir: /home/ubuntu/GodotNakama
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/tmp/runtime-dir
      - PULSE_SERVER=unix:/tmp/runtime-dir/pulse/native
      - DOTNET_CLI_TELEMETRY_OPTOUT=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - .:/home/ubuntu/GodotNakama:cached
      - '\\wsl.localhost\Ubuntu\mnt\wslg\.X11-unix:/tmp/.X11-unix:rw'
      - '\\wsl.localhost\Ubuntu\mnt\wslg\runtime-dir:/tmp/runtime-dir:rw'
      - '\\wsl.localhost\Ubuntu\usr\lib\wsl:/usr/lib/wsl:ro'
    devices:
      - /dev/dxg:/dev/dxg
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics, display, utility]
    depends_on:
      postgres:
        condition: service_healthy
      nakama:
        condition: service_healthy
  postgres:
    container_name: postgres
    image: postgres:18.6-trixie
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=localdb
    volumes:
      - postgres-data:/var/lib/postgresql
    expose:
      - "8080"
      - "5432"
    ports:
      - "5432:5432"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 5
  nakama:
    container_name: nakama
    image: heroiclabs/nakama:3.41.0
    user: "1000:1000"
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
          /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
          exec /nakama/nakama --name nakama1 --database.address postgres:localdb@postgres:5432/nakama --logger.level DEBUG --session.token_expiry_sec 7200          
    restart: unless-stopped
    links:
      - "postgres:db"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./nakama:/nakama/data
    expose:
      - "7349"
      - "7350"
      - "7351"
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data: