services:
  godot:
    container_name: godot
    build:
      context: ../../client
    working_dir: /home/ubuntu/GodotNakama
    ipc: host
    environment:
      - DISPLAY=:1
      - WAYLAND_DISPLAY=
      - XAUTHORITY=/tmp/.Xauthority
      - XDG_RUNTIME_DIR=/tmp/runtime-dir
      - PULSE_SERVER=unix:/tmp/runtime-dir/pulse/native
      - VSCODE_DOTNET_RUNTIME_DISABLE_MUTEX=true
      - DOTNET_CLI_TELEMETRY_OPTOUT=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all,graphics,utility,display,compute
    volumes:
      - ../../:/home/ubuntu/GodotNakama:cached
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/tmp/.Xauthority:ro
      - /run/user/1000:/tmp/runtime-dir:rw

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics, utility, compute]

  postgres:
    container_name: postgres
    image: postgres:18.6-trixie
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=localdb
    volumes:
      - postgres-data:/var/lib/postgresql
    expose:
      - "8080"
      - "5432"
    ports:
      - "5432:5432"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 5

  rustfs:
    container_name: rustfs
    image: rustfs/rustfs:1.0.1
    command: ["/data"]
    environment:
      - RUSTFS_ACCESS_KEY=admin
      - RUSTFS_SECRET_KEY=password123
      - RUSTFS_ADDRESS=:9000
    volumes:
      - rustfs-data:/data
    expose:
      - "9000"
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  nakama:
    container_name: nakama
    image: heroiclabs/nakama:3.41.0
    user: "1000:1000"
    environment:
      - RUSTFS_ENDPOINT=rustfs:9000
      - RUSTFS_ACCESS_KEY=admin
      - RUSTFS_SECRET_KEY=password123
      - RUSTFS_USE_SSL=false
      - RUSTFS_BUCKET=nakama-world-states
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
          /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
          exec /nakama/nakama --config /nakama/data/my-config.yml
    restart: unless-stopped
    links:
      - "postgres:db"
      - "rustfs:rustfs"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    volumes:
      - ../../nakama:/nakama/data
    expose:
      - "7349"
      - "7350/tcp"
      - "7350/udp"
      - "7351"
    ports:
      - "7349:7349"
      - "7350:7350/tcp"
      - "7350:7350/udp"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  rustfs-data: