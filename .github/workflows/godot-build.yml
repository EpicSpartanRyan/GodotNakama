name: Build Godot

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-executables:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Install Node.js (Required for GitHub Local Actions)
        run: apt-get update && apt-get install -y nodejs

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies & git-lfs
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            wget \
            unzip \
            git \
            git-lfs \
            libgl1 \
            libxcursor1 \
            libxi6 \
            libxinerama1 \
            libxrandr2 \
            libxkbcommon0 \
            libasound2t64 \
            libpulse0 \
            fontconfig \
            libfontconfig1 \
            && rm -rf /var/lib/apt/lists/*
          git lfs install --system

      - name: Download and install Godot 4.7.2 .NET (Mono)
        run: |
          GODOT_VERSION="4.7.2"
          GODOT_RELEASE="stable"
          GODOT_BUILD="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_mono_linux_x86_64"
          wget --quiet https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${GODOT_BUILD}.zip
          unzip ${GODOT_BUILD}.zip -d /opt/godot
          rm ${GODOT_BUILD}.zip
          mv /opt/godot/${GODOT_BUILD} /opt/godot/godot-mono
          ln -s /opt/godot/godot-mono/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_mono_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot Export Templates
        run: |
          V="4.7.2"
          DIR="${V}.stable.mono"
          URL="https://github.com/godotengine/godot-builds/releases/download/${V}-stable/Godot_v${V}-stable_mono_export_templates.tpz"
          echo "Downloading Godot ${V} Mono templates..."
          curl -L -o /tmp/tpl.zip "$URL"
          mkdir -p /tmp/gtpl
          unzip -q /tmp/tpl.zip -d /tmp/gtpl
          mkdir -p ~/.local/share/godot/export_templates/$DIR
          mv /tmp/gtpl/templates/* ~/.local/share/godot/export_templates/$DIR/
          rm -rf /tmp/tpl.zip /tmp/gtpl

      - name: Inject secrets and Instantiate templates
        env:
          BACKTRACEURL: ${{ secrets.BACKTRACEURL }}
          DISCORDAPPID: ${{ secrets.DISCORDAPPID }}
        run: |
          find . -type f -name '*.template' | while read -r f; do
            dest="${f%.template}"
            if [ ! -f "$dest" ]; then
              cp "$f" "$dest"
              
              # Reemplazar los placeholders por los valores de los secretos de GitHub
              sed -i "s|YOUR_BACKTRACE_URL_HERE|${BACKTRACEURL}|g" "$dest"
              sed -i "s|YOUR_DISCORD_APP_ID_HERE|${DISCORDAPPID}|g" "$dest"
              
              echo "Created and injected secrets into: $dest"
            fi
          done
        working-directory: client/sample-game

      - name: Install Godot Addons
        run: |
          godot --headless -s plug.gd install force debug || true
          rm -rf .plugged
        working-directory: client/sample-game

      - name: Restore .NET Tools & Build C# project
        run: |
          dotnet tool restore || true
          dotnet build
        working-directory: client/sample-game

      - name: Export Game for Windows, Linux, and macOS
        run: |
          mkdir -p builds
          godot --headless --export-release "Windows Desktop" builds/windows-game.zip
          godot --headless --export-release "Linux" builds/linux-game.zip
          godot --headless --export-release "macOS" builds/macos-game.zip
        working-directory: client/sample-game

      - name: Upload Windows Build
        uses: actions/upload-artifact@v5
        with:
          name: windows-build
          path: client/sample-game/builds/windows-game.zip
          retention-days: 7
          overwrite: true

      - name: Upload Linux Build
        uses: actions/upload-artifact@v5
        with:
          name: linux-build
          path: client/sample-game/builds/linux-game.zip
          retention-days: 7
          overwrite: true

      - name: Upload macOS Build
        uses: actions/upload-artifact@v5
        with:
          name: macos-build
          path: client/sample-game/builds/macos-game.zip
          retention-days: 7
          overwrite: true

      - name: Upload Game Builds as Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: game-builds
          path: client/sample-game/builds/
          retention-days: 7
          overwrite: true