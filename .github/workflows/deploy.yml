name: Deploy Nakama

on:
  workflow_dispatch:

env:
  SERVER_PROJECT_PATH: "$HOME/my-nakama-project"

jobs:
  build-and-deploy:
    runs-on: ubuntu-26.04

    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - name: Install Node.js (Required for act & GitHub Local Actions)
        run: apt-get update && apt-get install -y nodejs

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: backend/go.sum

      - name: Nakama Go Vendor
        working-directory: backend
        run: |
          go mod tidy
          go mod vendor

      - name: Install C Compiler for CGO
        run: apt-get update && apt-get install -y gcc libc6-dev

      - name: Nakama Build Plugin
        working-directory: backend
        env:
          CGO_ENABLED: 1
        run: |
          go build \
            --trimpath \
            --mod=vendor \
            -buildvcs=false \
            --buildmode=plugin \
            -o backend.so

      - name: Inject secrets into Nakama Config Template
        working-directory: nakama
        env:
          NAKAMA_USERNAME: ${{ secrets.NAKAMA_USERNAME }}
          NAKAMA_PASSWORD: ${{ secrets.NAKAMA_PASSWORD }}
        run: |
          find . -type f -name '*.template' | while read -r f; do
            dest="${f%.template}"

            cp "$f" "$dest"

            sed -i "s|NAKAMA_USERNAME|${NAKAMA_USERNAME}|g" "$dest"
            sed -i "s|NAKAMA_PASSWORD|${NAKAMA_PASSWORD}|g" "$dest"

            echo "Injected secrets into: $dest"
          done

      - name: Stop Services & Sync Repository
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euxo pipefail

            PROJECT_PATH="$HOME/my-nakama-project"
            DEVCONTAINER_PATH="$PROJECT_PATH/.devcontainer"

            echo "=== STOP SERVICES ==="

            if [ -f "$DEVCONTAINER_PATH/docker-compose.yml" ]; then
              cd "$PROJECT_PATH"
              docker compose -f .devcontainer/docker-compose.yml down || true
            fi

            echo "=== SYNC REPOSITORY ==="

            if [ ! -d "$PROJECT_PATH/.git" ]; then

              rm -rf "$PROJECT_PATH"

              git clone \
                "https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git" \
                "$PROJECT_PATH"

            else

              cd "$PROJECT_PATH"

              git remote set-url origin \
                "https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git"

              git fetch --all --prune

              git checkout main

              git reset --hard origin/main

              git clean -xfd

            fi

            echo "=== CURRENT COMMIT ==="
            git rev-parse HEAD

            mkdir -p "$PROJECT_PATH/nakama/modules"

      - name: Transfer backend.so to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/backend.so"
          target: "~/my-nakama-project/nakama/modules"
          strip_components: 1

      - name: Transfer configured my-config.yml to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "nakama/my-config.yml"
          target: "~/my-nakama-project/nakama"
          strip_components: 1

      - name: Start Server Services
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euxo pipefail

            PROJECT_PATH="$HOME/my-nakama-project"

            cd "$PROJECT_PATH"

            echo "=== COMPOSE SERVICES ==="
            docker compose -f .devcontainer/docker-compose.yml config --services

            docker compose -f .devcontainer/docker-compose.yml up --build -d postgres nakama rustfs