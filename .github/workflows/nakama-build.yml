name: Build Nakama

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-plugin:
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Install Node.js (Required for GitHub Local Actions)
        run: apt-get update && apt-get install -y nodejs

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load pinned versions
        run: |
          set -a
          . ./versions.env
          set +a
          echo "GO_VERSION=${GO_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Nakama Go Vendor
        run: |
          go mod tidy
          go mod vendor
        working-directory: backend

      - name: Run Go tests
        run: go test --mod=vendor ./...
        working-directory: backend

      - name: Install C Compiler for CGO
        run: apt-get update && apt-get install -y gcc libc6-dev

      - name: Nakama Build Plugin
        env:
          CGO_ENABLED: 1
        run: go build --trimpath --mod=vendor -buildvcs=false --buildmode=plugin -o backend.so
        working-directory: backend

      - name: Upload Nakama Plugin as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: nakama-plugin-backend
          path: backend/backend.so
          retention-days: 7
          overwrite: true